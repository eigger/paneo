name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The runners are UTC, which hides timezone bugs (recurring-event expansion
      # was once shifted by the server's UTC offset) — rerun the calendar tests elsewhere.
      - name: Run calendar proxy tests in a non-UTC timezone
        run: TZ=Asia/Seoul node --test test/dataproxy.test.js

      - name: Syntax check server and agent
        run: |
          node --check src/server.js
          node --check agent/agent.js

      - name: Validate installer shell scripts
        run: |
          bash -n install.sh
          bash -n scripts/install-pi.sh
          bash -n scripts/update-pi.sh
          bash -n scripts/diagnose-pi.sh
          bash -n agent/install.sh
